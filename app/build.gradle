plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'kotlin-android'
}

android {
    namespace 'com.xian.leihuhu'
    compileSdk rootProject.ext.compileSdkVersion
    aaptOptions.cruncherEnabled = false
    aaptOptions.useNewCruncher = false


    defaultConfig {
        applicationId "com.xian.leihuhu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ndk {
            //根据需要 自行选择添加的对应cpu类型的.so库。
            abiFilters "armeabi-v7a", "arm64-v8a"
//            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86'
        }

        manifestPlaceholders = [
                //华为 HMS AppID（在华为开发者联盟注册后获取）
                HM_APPID      : "118943381",
                //小米推送 AppID/AppKey（在小米开放平台注册后获取）
                XIAOMI_APPID  : "2882303761520580396",
                XIAOMI_APPKEY : "5972058070396",
                //OPPO推送 AppKey/AppSecret（在OPPO开放平台注册后获取）
                OPPO_APPKEY   : "48d56cf2c6414d2fb824924a86282368",
                OPPO_APPID    : "37703343",
                OPPO_APPSECRET: "24a9a6b614fb4809b12e1917b3019ca2",
                //Vivo推送 AppID/AppKey/AppSecret（在vivo推送后台注册后获取）
                VIVO_APPID    : "106147728",
                VIVO_APPKEY   : "c46cfdea94517a83e1c56524571979eb",
                VIVO_APPSECRET: "bb6502a6-f518-447d-8b94-e8c3e9b0f9d2",
        ]
    }

    signingConfigs {
        release {
            storeFile file('leihuhu.jks')
            storePassword 'leihuhu2026'
            keyAlias 'leihuhu'
            keyPassword 'leihuhu2026'
        }
    }

    buildTypes {
        release {
//            jniDebuggable true
//            zipAlignEnabled true   //Zipalign优化
//            minifyEnabled true  // 是否混淆
//            shrinkResources true  // 是否去除无效的资源文件
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    api project(':wkbase')
    implementation project(path: ':wkuikit')
    implementation project(path: ':wklogin')
    implementation project(path: ':wkscan')
    implementation project(path: ':wkpush')
    //华为 agconnect 核心
    implementation 'com.huawei.agconnect:agconnect-core:1.7.0.300'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}

//华为推送 agconnect 插件（必须在文件底部）
apply plugin: 'com.huawei.agconnect'