apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/library_release.kotlin_module']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "10000"
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
    namespace 'com.chat.base'

}
repositories {
//    flatDir {
//        dirs 'libs'
//    }
}
dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.preference:preference:1.2.1'
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    api 'com.google.android.material:material:1.12.0'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'
//    api 'com.android.support:design:29.0.0'
    api 'androidx.recyclerview:recyclerview:1.3.2'
    api 'androidx.viewpager2:viewpager2:1.1.0'
    api "io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.14"

    api 'com.github.li-xiaojun:XPopup:2.9.19'
    api 'androidx.multidex:multidex:2.0.1'

    api 'com.alibaba:fastjson:1.2.83'
    //鍔ㄦ€佹潈闄?
    api 'com.github.tbruyelle:rxpermissions:v0.11'
    //glide
    api('com.github.bumptech.glide:glide:4.16.0') {
        transitive = true
    }
        api('com.squareup.okhttp3:okhttp:5.0.0-alpha.2')
    // https://github.com/LuckSiege/PictureSelector
    api 'io.github.lucksiege:pictureselector:v3.11.2'
    implementation 'io.github.lucksiege:compress:v3.11.2'
    //鍒锋柊 - exclude SpinKit from all transitive paths, declare once explicitly
    api('io.github.scwang90:refresh-layout-kernel:2.0.6') {
        exclude group: 'com.github.ybq', module: 'Android-SpinKit'
    }
    api('io.github.scwang90:refresh-header-classics:2.0.6') {
        exclude group: 'com.github.ybq', module: 'Android-SpinKit'
    }
    api 'com.github.ybq:Android-SpinKit:1.4.0'
    api 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation('com.squareup.retrofit2:converter-gson:2.11.0') {
        exclude group: 'com.google.code.gson'
    }
    api 'com.squareup.retrofit2:converter-gson:2.11.0'
    api 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2'
    api "com.squareup.retrofit2:adapter-rxjava3:2.9.0"
    api 'io.reactivex.rxjava3:rxandroid:3.0.0'
    api 'io.reactivex.rxjava3:rxjava:3.1.5'
    // rxpermissions2 需要 rxjava 2.x
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    api 'io.reactivex.rxjava2:rxjava:2.2.21'
    api 'com.github.DSAppTeam:PanelSwitchHelper:v1.5.9'
    // 鑵捐x5 webView
    api 'com.tencent.tbs:tbssdk:44085'
    // 鍥剧墖瑁佸壀  https://github.com/CanHub/Android-Image-Cropper
    implementation 'com.vanniktech:android-image-cropper:4.6.0'
    api 'org.jsoup:jsoup:1.15.2'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    api 'androidx.emoji2:emoji2:1.6.0'
    api "androidx.emoji2:emoji2-views:1.6.0"
    // CameraX - 扫码和相机预览所需
    api "androidx.camera:camera-view:$camerax_version"
    api project(path: ':MyLibs:rlottie')
    api('io.github.carguo:gsyvideoplayer:11.3.0') {
        transitive = true
    }
    // GSYVideoPlayer ExoPlayer2 引擎，替代 IJKPlayer，提升流媒体缓存和首帧速度
    api 'io.github.carguo:gsyvideoplayer-exo2:11.3.0'
    // 杩滅▼浠撳簱
    api 'com.github.WuKongIM:WuKongIMAndroidSDK:1.5.5'
    // SQLCipher 由 WuKongIM SDK 统一提供，避免版本冲突导致 UnsatisfiedLinkError
    // implementation "net.zetetic:android-database-sqlcipher:4.5.3"
    compileOnly "net.zetetic:android-database-sqlcipher:4.5.3"
    implementation "androidx.sqlite:sqlite-ktx:2.4.0"
    implementation 'org.whispersystems:curve25519-android:0.5.0'
    implementation 'org.whispersystems:signal-protocol-android:2.8.1'
    // 鑵捐浜?TRTC 瀹炴椂闊宠棰?SDK
    api 'com.tencent.liteav:LiteAVSDK_TRTC:11.8.0.14188'
    // AMap SDK (combined: 3dmap + location + search)
    api 'com.amap.api:3dmap-location-search:latest.integration'
    // FFmpegKit - HLS转码(m3u8+ts分片)，实现视频秒发秒收
    api 'com.arthenica:ffmpeg-kit-full-gpl:6.0-2.LTS'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'

}
