apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.chat.push'

}

dependencies {
    api project(':wkbase')

    // ==================== 厂商推送SDK（直连厂商通道，不经过友盟聚合） ====================

    // 小米推送（厂商SDK，本地Maven仓库引入）
    implementation 'com.xiaomi.mipush:xiaomi-push:7.9.2'

    // 华为推送（HMS Push Kit，直接Maven依赖）
    api 'com.huawei.hms:push:6.13.0.301'

    // OPPO推送（厂商SDK，本地Maven仓库引入）
    implementation 'com.oppo.push:oppo-push:3.7.1'

    // Vivo推送（厂商SDK，本地Maven仓库引入）
    implementation 'com.vivo.push:vivo-push:4.1.3.0'

    // 通用依赖
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'commons-codec:commons-codec:1.11'
    implementation 'androidx.annotation:annotation:1.6.0'
}
