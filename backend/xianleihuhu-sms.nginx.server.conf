# ============================================================
# 雷虎虎验证码服务 - Nginx 反向代理配置
# 路径: /etc/nginx/conf.d/xianleihuhu-sms.conf
# ============================================================

upstream sms_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream tsdd_backend {
    server 127.0.0.1:8091;
    keepalive 32;
}

upstream push_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

server {
    listen 8090;
    server_name _;


    # ===== Gzip 压缩（加速移动端消息/接口加载）=====
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ===== MinIO 对象存储直连（聊天图片/视频/头像/群文件接收加速）=====
    location ^~ /chat/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache media_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /avatar/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache media_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /group/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache media_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 验证码服务路径
    location /v1/user/sms/ {
        proxy_pass http://sms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location /v1/user/email/ {
        proxy_pass http://sms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # 群组管理代理 - WuKongIM原生不支持的群操作
    location ~ ^/v1/groups/[^/]+/disband$ {
